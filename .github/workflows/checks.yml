name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: server
      - name: Validate native Linux deployment configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          deploy_check_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_check_dir"' EXIT
          # Match the documented adjustment for a system-wide Node in another location.
          sed "s|/usr/bin/node|$(command -v node)|" server/deploy/proclaim-tap.service > "$deploy_check_dir/proclaim-tap.service"
          systemd-analyze verify "$deploy_check_dir/proclaim-tap.service"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=tap.revivalomaha.org \
            -keyout "$deploy_check_dir/key.pem" -out "$deploy_check_dir/cert.pem" 2>/dev/null
          sed \
            -e "s|/etc/letsencrypt/live/tap.revivalomaha.org/fullchain.pem|$deploy_check_dir/cert.pem|" \
            -e "s|/etc/letsencrypt/live/tap.revivalomaha.org/privkey.pem|$deploy_check_dir/key.pem|" \
            -e "s|/etc/nginx/snippets/proclaim-tap.conf|$PWD/server/deploy/nginx-proclaim-tap.conf|" \
            server/deploy/nginx-site.conf.example > "$deploy_check_dir/site.conf"
          printf 'events {}\nhttp { include %s/site.conf; }\n' "$deploy_check_dir" > "$deploy_check_dir/nginx.conf"
          sudo nginx -t -c "$deploy_check_dir/nginx.conf"
      - run: docker build -t proclaim-tap-test server
  companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift run TapChecks
      - run: swift build --product ProclaimTap
