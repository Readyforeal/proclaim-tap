name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: server
      - run: docker build -t proclaim-tap-test server
  companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift run TapChecks
      - run: swift build --product ProclaimTap
